# defo config
#
# package: the new package id / application id for the clone.
#   Must be a different value than the original app's package,
#   or Android will treat it as an update instead of a new app.
package = com.himadricore.seendsnap

# label: the new app name shown under the launcher icon.
# Leave blank (or delete the line) to keep the original name.
label = seedsnap

# output: path to write the repackaged apk to.
# Leave blank to default to <input>-defo.apk
output = seedsnap.apk
